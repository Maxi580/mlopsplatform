[project]
name = "mlopsplatform"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*", "packages/interface/cli"]
exclude = ["packages/interface"]

[tool.uv]
# Unsloth caps TRL below the version the hf backend trains with, so each has its own image.
conflicts = [[{ package = "mlp-stages", extra = "hf" }, { package = "mlp-stages", extra = "unsloth" }]]

[dependency-groups]
dev = ["pytest", "pyyaml", "httpx2", "ruff", "trustme"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mlp_core", "mlp_api", "mlp_cli", "mlp_stages", "mlp_sandbox"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
norecursedirs = ["node_modules", ".*"]
