# Our changes to KFP's platform-agnostic install; install.sh adds the upstream base and the SeaweedFS size.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # install.sh creates this Secret with generated keys instead of upstream's defaults.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: mlpipeline-minio-artifact
  # metadata-writer only handles KFP v1 pods, and its image is amd64-only.
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: metadata-writer
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: kubeflow-pipelines-metadata-writer
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: kubeflow-pipelines-metadata-writer-role
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: kubeflow-pipelines-metadata-writer-binding
  - target:
      kind: NetworkPolicy
      name: seaweedfs
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  mlp-object-store: allowed
          ports:
            - port: 8333
  - path: workflow-controller-configmap.yaml
  - path: ml-pipeline-config.yaml
