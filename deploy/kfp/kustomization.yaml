# Our changes to KFP's platform-agnostic install; install.sh adds the upstream base and the SeaweedFS size.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  # install.sh creates this Secret with generated keys instead of upstream's defaults.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: mlpipeline-minio-artifact
  - target:
      kind: NetworkPolicy
      name: seaweedfs
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - namespaceSelector:
                matchLabels:
                  mlp-object-store: allowed
          ports:
            - port: 8333
  - path: workflow-controller-configmap.yaml
