# Upstream's workflowDefaults plus podGC, minus its retryStrategy: Pipelines are never retried
# automatically. Failed step pods stay until the workflow's TTL, so the API can read why they failed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-controller-configmap
data:
  workflowDefaults: |
    spec:
      podGC:
        strategy: OnPodSuccess
      ttlStrategy:
        secondsAfterCompletion: 3600
        secondsAfterSuccess: 3600
        secondsAfterFailure: 3600
