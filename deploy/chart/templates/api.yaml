apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: {{ .Values.ports.api }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        checksum/settings: {{ .Values.settings | toJson | sha256sum }}
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: {{ .Values.images.api }}:{{ required "images.tag is set by install.sh" .Values.images.tag }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-settings
          env:
            - name: UVICORN_PORT
              value: {{ .Values.ports.api | quote }}
            # Only Traefik reaches the API, so trust its X-Forwarded-For for login rate limits.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mlp-credentials
                  key: jwtSecret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlp-credentials
                  key: postgresPassword
            - name: DATABASE_URL
              value: postgresql+psycopg://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres:{{ .Values.ports.postgres }}/{{ .Values.postgres.database }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlp-credentials
                  key: s3AccessKey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlp-credentials
                  key: s3SecretKey
            - name: S3_ENDPOINT_URL
              value: http://seaweedfs.{{ .Values.namespaces.kubeflow }}.svc.cluster.local:{{ .Values.ports.seaweedfs }}
            - name: S3_PUBLIC_URL
              value: https://{{ .Values.domain }}
            - name: S3_BUCKET
              value: {{ .Values.platformBucket }}
            - name: MLFLOW_URL
              value: http://mlflow.{{ .Values.namespaces.mlflow }}.svc.cluster.local:{{ .Values.ports.mlflow }}
            # MLflow keeps Model Version files here; the API reads their sizes and deletes them.
            - name: MLFLOW_BUCKET
              value: {{ .Values.mlflow.artifactRoot.s3.bucket }}
            - name: KUBEFLOW_URL
              value: http://ml-pipeline.{{ .Values.namespaces.kubeflow }}.svc.cluster.local:{{ .Values.ports.kfpApi }}
            - name: KUBEFLOW_NAMESPACE
              value: {{ .Values.namespaces.kubeflow }}
            - name: STAGES_IMAGE
              value: {{ .Values.images.stages }}:{{ .Values.images.tag }}
            - name: TRAINER_HF_IMAGE
              value: {{ .Values.images.trainerHf }}:{{ .Values.images.tag }}
            - name: TRAINER_UNSLOTH_IMAGE
              value: {{ .Values.images.trainerUnsloth }}:{{ .Values.images.tag }}
            - name: MODEL_CACHE_PVC
              value: {{ .Values.modelCachePvc }}
            # Where a Pipeline's `serve` step asks the API to start its Endpoint, inside the cluster.
            - name: API_URL
              value: http://api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ports.api }}
            # Where Pipeline steps send snippets.
            - name: SANDBOX_URL
              value: http://sandbox.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ports.sandbox }}
            # Endpoints run in this namespace, mount the Model Cache from the node and are routed
            # under the domain.
            - name: PLATFORM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DOMAIN
              value: {{ .Values.domain }}
            - name: VLLM_IMAGE
              value: {{ .Values.images.vllm }}
            - name: MODEL_CACHE_HOST_PATH
              value: {{ .Values.modelCacheHostPath }}
          # The janitor lists and evicts Base Models where the steps' HF_HOME puts them.
          volumeMounts:
            - name: model-cache
              mountPath: /model-cache
          ports:
            - containerPort: {{ .Values.ports.api }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ports.api }}
      volumes:
        - name: model-cache
          hostPath:
            path: {{ .Values.modelCacheHostPath }}
            type: DirectoryOrCreate
