# One domain, split by path: the free Azure DNS name has no subdomains.
{{- $host := printf "Host(`%s`)" .Values.domain }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: platform
spec:
  entryPoints: [websecure]
  tls: {}
  routes:
    - kind: Rule
      match: {{ $host }}
      services:
        - name: api
          port: {{ .Values.ports.api }}
    - kind: Rule
      match: {{ $host }} && (Path(`/`) || Path(`/ui`))
      middlewares:
        - name: webui-redirect
      services:
        - name: noop@internal
          kind: TraefikService
    - kind: Rule
      match: {{ $host }} && PathPrefix(`/ui/`)
      services:
        - name: webui
          port: {{ .Values.ports.webui }}
    - kind: Rule
      match: {{ $host }} && PathPrefix(`/pipeline/`)
      middlewares:
        - name: login
      services:
        - name: ml-pipeline-ui
          namespace: {{ .Values.namespaces.kubeflow }}
          port: {{ .Values.ports.kfpUi }}
    # Presigned downloads and model part uploads; their signature is the login, so the path goes to
    # SeaweedFS as is. Matched by signature, as the mlflow bucket's paths overlap the MLflow UI's.
    - kind: Rule
      match: {{ $host }} && QueryRegexp(`X-Amz-Signature`, `.+`) && (Method(`GET`) || Method(`PUT`))
      priority: 1000
      services:
        - name: seaweedfs
          namespace: {{ .Values.namespaces.kubeflow }}
          port: {{ .Values.ports.seaweedfs }}
    - kind: Rule
      match: {{ $host }} && Path(`/mlflow`)
      middlewares:
        - name: mlflow-add-slash
      services:
        - name: noop@internal
          kind: TraefikService
    - kind: Rule
      match: {{ $host }} && PathPrefix(`/mlflow/`)
      middlewares:
        - name: login
        - name: mlflow-strip-prefix
      services:
        - name: mlflow
          namespace: {{ .Values.namespaces.mlflow }}
          port: {{ .Values.ports.mlflow }}
---
# The KFP UI and MLflow UI have no login of their own; the API checks the login cookie or token.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login
spec:
  forwardAuth:
    address: http://api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ports.api }}/auth/verify
---
# The MLflow UI uses relative URLs, so it works under /mlflow/ once the prefix is stripped.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-strip-prefix
spec:
  stripPrefix:
    prefixes: [/mlflow]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-add-slash
spec:
  redirectRegex:
    regex: ^(.*)/mlflow$
    replacement: ${1}/mlflow/
    permanent: true
---
# The platform's front page, and /ui without its slash, is the Web UI.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: webui-redirect
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/(ui)?$
    replacement: ${1}/ui/
