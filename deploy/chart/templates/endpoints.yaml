# The API creates each Endpoint's Deployment, Service and route in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlp-api-endpoints
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes]
    verbs: [create, delete]
  # An Endpoint's pod shows whether vLLM is ready or keeps failing.
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlp-api-endpoints
subjects:
  - kind: ServiceAccount
    name: api
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlp-api-endpoints
---
# `/serving/<uuid>/v1/...` reaches vLLM as `/v1/...`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: endpoint-strip-prefix
spec:
  stripPrefixRegex:
    regex: ["^/serving/[^/]+"]
