# Every GPU workload waits in one queue for its GPU Share, counted in the device plugin's slices of
# all GPUs: oldest first, but a newer one goes ahead if the older one doesn't fit; nothing running
# is ever evicted.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: {{ .Values.gpuQueue }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ .Values.gpuQueue }}
spec:
  namespaceSelector: {}
  # Lends the Smoke Test's queue what it doesn't use.
  cohortName: {{ .Values.gpuQueue }}
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
  resourceGroups:
    - coveredResources: [nvidia.com/gpu]
      flavors:
        - name: {{ .Values.gpuQueue }}
          resources:
            - name: nvidia.com/gpu
              nominalQuota: {{ .Values.gpuQuota }}
---
# The Smoke Test's: one pod at a time, on slices borrowed from the queue above, so both together
# never hand out more than all GPUs.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ .Values.smokeTestQueue }}
spec:
  namespaceSelector: {}
  cohortName: {{ .Values.gpuQueue }}
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
  resourceGroups:
    - coveredResources: [nvidia.com/gpu, pods]
      flavors:
        - name: {{ .Values.gpuQueue }}
          resources:
            - name: nvidia.com/gpu
              nominalQuota: 0
              borrowingLimit: {{ div (mul .Values.gpuQuota .Values.smokeTestGpuPercent) 100 }}
            - name: pods
              nominalQuota: 1
{{- range $namespace := list .Values.namespaces.kubeflow .Release.Namespace }}
{{- range list $.Values.gpuQueue $.Values.smokeTestQueue }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: {{ . }}
  namespace: {{ $namespace }}
spec:
  clusterQueue: {{ . }}
{{- end }}
{{- end }}
