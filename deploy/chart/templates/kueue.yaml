# Every GPU workload waits in one queue for its GPU Share, counted in the device plugin's slices of
# all GPUs: oldest first, but a newer one goes ahead if the older one doesn't fit. A multi-pod
# TrainJob starts only once all its slices are free, and nothing running is ever evicted.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: {{ .Values.gpuQueue }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ .Values.gpuQueue }}
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
  resourceGroups:
    - coveredResources: [nvidia.com/gpu]
      flavors:
        - name: {{ .Values.gpuQueue }}
          resources:
            - name: nvidia.com/gpu
              nominalQuota: {{ .Values.gpuQuota }}
{{- range list .Values.namespaces.kubeflow .Release.Namespace }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: {{ $.Values.gpuQueue }}
  namespace: {{ . }}
spec:
  clusterQueue: {{ $.Values.gpuQueue }}
{{- end }}
