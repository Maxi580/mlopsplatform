# The one place naming namespaces, images, upstream versions, ports and platform settings defaults.
# values-<env>.yaml override only what differs per environment.

domain: ""
# Names or IPs for the certificate to cover, beside the domain, localhost and 127.0.0.1.
extraAddresses: []

namespaces:
  platform: mlp
  kubeflow: kubeflow
  mlflow: mlflow
  certManager: cert-manager
  kubeSystem: kube-system
  kueue: kueue-system

versions:
  k3s: v1.37.1+k3s1
  nerdctl: 2.4.0
  buildkit: v0.33.1
  helm: v3.22.0
  certManager: v1.21.2
  kfp: 2.17.2
  mlflowChart: 1.11.7
  nvidiaDevicePlugin: v0.20.1
  kueue: 0.20.1
  # BFCL, which `evaluate` runs for tool calling in a virtualenv of its own.
  bfcl: 2026.3.23
  # The oldest NVIDIA driver install.sh accepts.
  minNvidiaDriver: 580

images:
  python: python:3.12-slim
  uv: ghcr.io/astral-sh/uv:0.12.22
  node: node:22-alpine
  nginx: nginxinc/nginx-unprivileged:1.29-alpine
  postgres: postgres:17
  api: mlp-api
  # Runs snippets under gVisor; Python only, with the packages the image pins.
  sandbox: mlp-sandbox
  # The Endpoint Proxy: Python with httpx and OpenTelemetry, no torch.
  proxy: mlp-proxy
  # Runs every Pipeline step but training, on the vLLM image, as `distill` and `evaluate` serve
  # models with it.
  stages: mlp-stages
  # Runs finetune on the hf backend: the stages image plus TRL, PEFT and CUDA-enabled torch.
  trainerHf: mlp-trainer-hf
  # Runs finetune on the unsloth backend: Unsloth with the TRL and Transformers it supports.
  trainerUnsloth: mlp-trainer-unsloth
  # Builds the Web UI with node and serves its static files with nginx.
  webui: mlp-webui
  # Endpoints run the upstream vLLM image as is.
  vllm: vllm/vllm-openai:v0.30.0
  # The daily `mlflow gc` runs the image of the MLflow chart's appVersion; bump with mlflowChart.
  mlflow: burakince/mlflow:3.16.0
  # Set by install.sh to the short git SHA.
  tag: ""

ports:
  api: 8000
  sandbox: 8090
  proxy: 8010
  gpuReporter: 8020
  webui: 8080
  postgres: 5432
  kfpUi: 80
  kfpApi: 8888
  kfpMetadata: 9090
  mlflow: 80
  seaweedfs: 8333

postgres:
  user: mlp
  database: platform
  storage: 10Gi

# Created in SeaweedFS next to KFP's own mlpipeline bucket.
buckets: [mlflow, platform]
# Holds Dataset Versions and Checkpoints.
platformBucket: platform
# Shared by every Pipeline step in the kubeflow namespace; sized by settings.model_cache_size.
modelCachePvc: model-cache
# The Model Cache's directory on the node, which the steps' PVC and the API's janitor both mount.
modelCacheHostPath: /var/lib/mlp/model-cache
# Memory of a Sandbox replica beyond its snippets' own: the server and gVisor.
sandboxServerMemoryMb: 512
# When `mlflow gc` purges what was deleted in MLflow, as cron.
mlflowGcSchedule: "0 3 * * *"
# install.sh prunes the BuildKit cache down to this size after building.
buildCacheGb: 50
# The Kueue queue every GPU workload waits in: KFP GPU steps and Endpoints.
gpuQueue: gpu
# What that queue may hand out at once in `nvidia.com/gpu`: install.sh sets it to all GPUs' slices.
gpuQuota: 20

# Kueue's Configuration; install.sh limits its pod and Deployment webhooks to the platform's
# namespaces, so k3s's own pods are never held back.
kueue:
  apiVersion: config.kueue.x-k8s.io/v1beta2
  kind: Configuration
  health:
    healthProbeBindAddress: :8081
  metrics:
    bindAddress: :8443
  webhook:
    port: 9443
  leaderElection:
    leaderElect: true
    resourceName: c1f6bfd2.kueue.x-k8s.io
  managedJobsNamespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: []
  integrations:
    frameworks: [pod, deployment]
  # Only GPUs are counted; CPU and memory stay the scheduler's.
  resources:
    excludeResourcePrefixes: [cpu, memory, ephemeral-storage, hugepages-]

# Rendered into the platform settings ConfigMap, read through mlp_core.settings.
settings:
  # install.sh counts the cluster's physical GPUs; every step and Endpoint uses one.
  gpu_count: 1
  # install.sh switches it off if a machine has several GPUs: jobs then take whole GPUs (#117).
  gpu_sharing: true
  # The device plugin offers each GPU as slices of this share; a GPU Share is rounded up to them.
  gpu_slice: 0.05
  # What a calculated GPU Share counts in, untested on our hardware: correct from real runs.
  # vLLM: factor × weights + reserve + the shared-memory reserve.
  gpu_share_weights_factor: 1.5
  gpu_share_vllm_reserve_gib: 2
  gpu_share_shared_memory_reserve_gib: 4
  # The longest prompt plus reply a model is served with unless the user raises it.
  gpu_share_max_model_len: 32768
  # Training: factor × weights + reserve. Too high only makes a job wait; too low fails late.
  gpu_share_training_factor: 2
  gpu_share_full_training_factor: 6
  gpu_share_training_reserve_gib: 2
  # Only a recommendation: forms show it, calculated shares stop there, a user can enter up to 1.
  gpu_max_utilization: 0.85
  sandbox_timeout_seconds: 10
  sandbox_memory_mb: 1024
  sandbox_replicas: 1
  # Each replica runs this many snippets at once.
  sandbox_cpus_per_replica: 2
  model_cache_size: 200Gi
  model_cache_high_water_mark: 0.9
  object_store_size: 100Gi
  checkpoint_minutes: 30
  speculate_dataloader_workers: 4

# Values for the upstream MLflow chart; install.sh adds the in-cluster hostnames.
mlflow:
  backendStore:
    databaseMigration: true
    databaseConnectionCheck: true
    postgres:
      enabled: true
      database: mlflow
    existingDatabaseSecret:
      name: mlflow-credentials
  artifactRoot:
    proxiedArtifactStorage: true
    s3:
      enabled: true
      bucket: mlflow
      existingSecret:
        name: mlflow-credentials
  # The edge login protects MLflow; in-cluster callers and kubelet probes use other host names.
  serverAllowedHosts: ["*"]
