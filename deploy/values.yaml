# The one place naming namespaces, images, upstream versions, ports and platform settings defaults.
# values-<env>.yaml override only what differs per environment.

domain: ""

namespaces:
  platform: mlp
  kubeflow: kubeflow
  mlflow: mlflow
  certManager: cert-manager
  kubeSystem: kube-system

versions:
  k3s: v1.37.1+k3s1
  nerdctl: 2.4.0
  buildkit: v0.33.1
  helm: v3.22.0
  certManager: v1.21.2
  kfp: 2.17.2
  mlflowChart: 1.11.7
  nvidiaDevicePlugin: v0.20.1
  # The oldest NVIDIA driver install.sh accepts.
  minNvidiaDriver: 580

images:
  python: python:3.12-slim
  uv: ghcr.io/astral-sh/uv:0.12.22
  node: node:22-alpine
  nginx: nginxinc/nginx-unprivileged:1.29-alpine
  postgres: postgres:17
  api: mlp-api
  # Runs every Pipeline step but training; built on the python image until a Stage needs vLLM.
  stages: mlp-stages
  # Runs finetune on the hf backend: the stages image plus TRL, PEFT and CUDA-enabled torch.
  trainerHf: mlp-trainer-hf
  # Builds the Web UI with node and serves its static files with nginx.
  webui: mlp-webui
  # Endpoints run the upstream vLLM image as is.
  vllm: vllm/vllm-openai:v0.30.0
  # Set by install.sh to the short git SHA.
  tag: ""

ports:
  api: 8000
  webui: 8080
  postgres: 5432
  kfpUi: 80
  kfpApi: 8888
  mlflow: 80
  seaweedfs: 8333

postgres:
  user: mlp
  database: platform
  storage: 10Gi

# Created in SeaweedFS next to KFP's own mlpipeline bucket.
buckets: [mlflow, platform]
# Holds Dataset Versions and Checkpoints.
platformBucket: platform
# Shared by every Pipeline step in the kubeflow namespace; sized by settings.model_cache_size.
modelCachePvc: model-cache
# The Model Cache's directory on the node, which the steps' PVC and the API's janitor both mount.
modelCacheHostPath: /var/lib/mlp/model-cache
# install.sh prunes the BuildKit cache down to this size after building.
buildCacheGb: 50

# Rendered into the platform settings ConfigMap, read through mlp_core.settings.
settings:
  gpu_count: 1
  gpus_per_stage: 1
  gpus_per_endpoint: 1
  sandbox_timeout_seconds: 10
  sandbox_memory_mb: 1024
  model_cache_size: 200Gi
  model_cache_high_water_mark: 0.9
  object_store_size: 100Gi
  checkpoint_minutes: 30
  speculate_dataloader_workers: 4

# Values for the upstream MLflow chart; install.sh adds the in-cluster hostnames.
mlflow:
  backendStore:
    databaseMigration: true
    databaseConnectionCheck: true
    postgres:
      enabled: true
      database: mlflow
    existingDatabaseSecret:
      name: mlflow-credentials
  artifactRoot:
    proxiedArtifactStorage: true
    s3:
      enabled: true
      bucket: mlflow
      existingSecret:
        name: mlflow-credentials
  # The edge login protects MLflow; in-cluster callers and kubelet probes use other host names.
  serverAllowedHosts: ["*"]
