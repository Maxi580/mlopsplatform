[project]
name = "mlp-stages"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mlp-core", "huggingface-hub>=1.31,<2", "boto3", "httpx2", "jsonschema"]

[project.optional-dependencies]
# The trainer-hf image: finetune with TRL + PEFT (bitsandbytes for QLoRA), logging to MLflow;
# grpo and rloo generate on vLLM in the same process, the version TRL supports and Endpoints run.
hf = ["trl>=1.14", "peft", "torch", "mlflow-skinny", "bitsandbytes", "vllm==0.30.0; sys_platform == 'linux'"]
# The trainer-unsloth image: Unsloth patches TRL and Transformers, so it pins the releases it
# supports; grpo and rloo generate on its own vLLM, the newest that runs with them.
unsloth = ["unsloth>=2026.9", "mlflow-skinny", "bitsandbytes", "vllm>=0.11; sys_platform == 'linux'"]
# The stages image: fetch downloads benchmarks and evaluate runs them with lm-eval and EvalScope
# against vLLM, which the image's vLLM base provides; quantize merges Adapters with PEFT and
# quantizes with llm-compressor; speculate trains Speculators with speculators.
evaluate = ["lm-eval[api,ifeval]>=0.4.13", "evalscope>=1.12", "mlflow-skinny", "guidellm>=0.7.4; sys_platform == 'linux'", "llmcompressor>=0.14", "peft", "speculators>=0.8"]

[project.scripts]
mlp-stage = "mlp_stages.main:main"

[tool.uv.sources]
mlp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
