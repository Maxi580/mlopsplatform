[project]
name = "mlp-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlp-core",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "pyjwt",
    "argon2-cffi",
    "huggingface-hub>=2.1.1",
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "boto3>=1.43.107",
]

[project.scripts]
set-password = "mlp_api.auth.account:set_password"

[tool.uv.sources]
mlp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
