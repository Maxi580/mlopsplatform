[project]
name = "mlp-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlp-core",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "pyjwt",
    "argon2-cffi",
    "huggingface-hub>=1.31,<2",
    "httpx2>=2.13.1",
    # huggingface-hub raises httpx errors.
    "httpx",
    "jsonschema>=4.26.0",
    "boto3>=1.43.107",
    "kfp>=2.17.0",
    "kfp-kubernetes>=2.17.0",
]

[project.scripts]
set-password = "mlp_api.auth.account:set_password"
running-work = "mlp_api.upgrade.running_work:print_running_work"
stop-running-work = "mlp_api.upgrade.running_work:stop_running_work"

[tool.uv.sources]
mlp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
