{% extends "base.html" %}
{% block content %}
<nav>
  <ul><li><strong>MLOps Platform</strong></li></ul>
  <ul>
    <li>{{ gpu_count }} GPU{{ "s" if gpu_count != 1 }}</li>
    <li><a href="{{ config.KUBEFLOW_UI_URL }}">Kubeflow</a></li>
    <li><a href="{{ config.MLFLOW_UI_URL }}">MLflow</a></li>
  </ul>
</nav>
<section>
  <h2>Pipelines</h2>
  <div id="pipeline-list" hx-get="{{ api_paths.WEB_PIPELINE_LIST }}"
       hx-trigger="every {{ config.PIPELINE_LIST_REFRESH }}, pipelines-changed from:body">
    {% include "pipeline_list.html" %}
  </div>
</section>
<section>
  <h2>New Pipeline</h2>
  {% include "pipeline_form.html" %}
</section>
{% endblock %}
