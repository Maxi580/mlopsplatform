# The unprivileged nginx image listens on 8080, which deploy/values.yaml names as ports.webui.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Every Web UI path is the one page; its router picks the view.
    location /ui/ {
        try_files $uri /ui/index.html;
    }

    # Built assets carry a content hash in their name.
    location /ui/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
